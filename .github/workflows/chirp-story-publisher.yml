name: Chirp approved story publisher
on:
  schedule:
    # Daily check; Python applies Chicago Monday/Wednesday/Friday and DST.
    - cron: '17 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chirp-story-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish one approved installment if eligible
        run: python scripts/publish_stories.py
      - name: Commit only changed feed data
        run: |
          if git diff --quiet -- data/chirps.json; then
            echo 'Nothing to publish.'
            exit 0
          fi
          git config user.name 'gnomeville-story-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/chirps.json
          git commit -m 'Chirp: publish approved story installment'
          git push
